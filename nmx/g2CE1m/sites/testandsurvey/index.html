<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HC Test and Survey Site</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
        color: #222;
        display: flex;
        flex-direction: column;
    }

    header {
        background: #1f4e79;
        color: white;
        text-align: center;
        padding: 28px 15px;
    }

    header h1 {
        font-size: clamp(24px, 5vw, 38px);
        font-weight: 700;
    }

    main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
    }

    .container {
        width: 100%;
        max-width: 600px;
        text-align: center;
    }

    .container h2 {
        margin-bottom: 30px;
        font-size: 26px;
    }

    .btn {
        display: block;
        width: 100%;
        max-width: 420px;
        margin: 16px auto;
        padding: 18px 24px;
        border-radius: 8px;
        background: #1f4e79;
        color: white;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        transition: 0.2s ease;
    }

    .btn:hover {
        background: #163a5c;
        transform: translateY(-2px);
    }

    footer {
        background: #222;
        color: #fff;
        text-align: center;
        padding: 25px 15px;
        line-height: 1.8;
    }

    footer a {
        color: #fff;
        text-decoration: none;
    }

    footer a:hover {
        text-decoration: underline;
    }

    .copyright {
        margin-top: 8px;
        font-size: 14px;
        opacity: 0.85;
    }
</style>
</head>

<body>

<header>
    <h1>HC Test and Survey Site</h1>
</header>

<main>
    <div class="container">

        <h2>Welcome</h2>

        <a
            class="btn"
            href="https://forms.gle/FaykR9KAwRLZna7S9"
            target="_blank"
            rel="noopener noreferrer">
            Enroll Now for Test
        </a>

        <a
            class="btn"
            href="https://hemchand.com.np/nmx/g2CE1m/sites/testandsurvey/PLB_test.html"
            target="_blank"
            rel="noopener noreferrer">
            Take a Test
        </a>

    </div>
</main>

<footer>
    <div>
        <a href="https://www.hemchand.com.np" target="_blank" rel="noopener noreferrer">
            www.hemchand.com.np
        </a>
    </div>

    <div>
        <a href="https://fwu-soa.blogspot.com" target="_blank" rel="noopener noreferrer">
            https://fwu-soa.blogspot.com
        </a>
    </div>

    <div class="copyright">
        Copyright 2026 Hem Chand
    </div>
</footer>

</body>
</html>
