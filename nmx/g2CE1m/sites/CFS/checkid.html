<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embedded Web App</title>
  <style>
    /* Make iframe cover the full viewport */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- Embed your Google Apps Script Web App -->
  <iframe src="https://script.google.com/macros/s/AKfycbyva4vYak9LCLHTxE_A3v3rOJHnCrKz_QJQborTuudEcKU9tqq2LeErYcUiFrrnWd-znA/exec"></iframe>
</body>
</html>
