<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      font-family: "Segoe UI", Arial, sans-serif;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 7rem;
      margin: 0;
      font-weight: bold;
      animation: glow 2s infinite alternate;
    }

    h2 {
      margin-top: 10px;
      font-size: 1.8rem;
    }

    p {
      font-size: 1.2rem;
      margin-top: 20px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 30px;
      font-size: 1rem;
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #ff512f, #dd2476);
      transition: 0.3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    a:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(0,0,0,0.4);
    }

    /* Glow animation */
    @keyframes glow {
      from {
        text-shadow: 0 0 10px #fff, 0 0 20px #ff00de, 0 0 30px #ff00de;
      }
      to {
        text-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff, 0 0 60px #00f0ff;
      }
    }

    /* Floating circles */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 15s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-50vh) scale(1.2); }
      100% { transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <!-- Background circles -->
  <div class="circle" style="width:120px;height:120px;left:10%;top:70%;animation-duration:20s;"></div>
  <div class="circle" style="width:80px;height:80px;left:80%;top:60%;animation-duration:18s;"></div>
  <div class="circle" style="width:100px;height:100px;left:40%;top:80%;animation-duration:25s;"></div>

  <!-- 404 content -->
  <h1>404</h1>
  <h2>Page Not Found | पृष्ठ फेला परेन</h2>
  <p>
    Sorry, the page you are looking for doesn’t exist.<br>
    माफ गर्नुहोस्, तपाईंले खोज्नुभएको पृष्ठ उपलब्ध छैन।
  </p>
  <a href="/">🏠 Go Back Home | गृह पृष्ठमा फर्कनुहोस्</a>
</body>
</html>
