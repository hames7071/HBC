<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Course Outline - HBC</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: 30px auto;
    }

    .course-button {
      background-color: #4CAF50;
      color: white;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .course-button:hover {
      background-color: #45a049;
    }

    .book-viewer {
      display: none;
      background-color: white;
      padding: 20px;
      margin-top: 20px;
      border: 2px solid #ccc;
      border-radius: 10px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .close-btn {
      float: right;
      cursor: pointer;
      font-size: 20px;
      color: red;
    }
  </style>
</head>
<body>

  <h1>Books, Reports and Assignments</h1>

  <div class="course-grid">
    <button class="course-button" onclick="openBook(Factor affecting AFS)">Factor affecting AFS</button> 
    <>br
    <button class="course-button" onclick="openBook(Role of Mansoon in Nepalese economy)">Role of Mansoon in Nepalese economy</button>
      <br>
    <button class="course-button" onclick="openBook(Phospholipids & its function in cell)">Phospholipids & its function in cell</button>
      <br>
    <button class="course-button" onclick="openBook(4)">Course Book 4</button>
    
  </div>

  <div id="bookViewer" class="book-viewer">
    <span class="close-btn" onclick="closeBook()">✖</span>
    <h2 id="bookTitle">Book Title</h2>
    <p id="bookContent">This is the content of the book. You can add a PDF viewer or text here.</p>
  </div>

  <script>
    function openBook(bookNumber) {
      const bookViewer = document.getElementById("bookViewer");
      const bookTitle = document.getElementById("bookTitle");
      const bookContent = document.getElementById("bookContent");

      bookTitle.innerText = `Course Book ${bookNumber}`;
      bookContent.innerText = `This is a preview or content of Course Book ${bookNumber}. You can replace this with PDF or detailed notes.`;
      
      bookViewer.style.display = "block";
    }

    function closeBook() {
      document.getElementById("bookViewer").style.display = "none";
    }
  </script>

</body>
</html>
