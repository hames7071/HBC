<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spiral Flipbook Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- DearFlip CSS -->
  <link rel="stylesheet" href="dflip/css/dflip.min.css">
  <link rel="stylesheet" href="dflip/css/themify-icons.min.css">

  <style>
    body {
      background: #f9f9f9;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    .spiral-wrapper {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
      padding-left: 60px; /* Space for spiral */
      background: url('https://www.pngfind.com/mpng/hJmTJR_spiral-bound-notebook-hd-png') no-repeat left center;
      background-size: 50px auto;
    }

    ._df_book {
      width: 100%;
      min-height: 600px;
    }
  </style>
</head>
<body>

  <h1 style="text-align:center; margin-bottom: 20px;">📘 My Spiral Flipbook</h1>

  <!-- Spiral Flipbook Container -->
  <div class="df-3dcanvas">
    <div class="_df_book df-flipbook-3d" source="examples/Agronomy_note.pdf"></div>
  </div>

  <!-- DearFlip JS -->
  <script src="dflip/js/libs/jquery.min.js"></script>
  <script src="dflip/js/dflip.min.js"></script>

</body>
</html>
