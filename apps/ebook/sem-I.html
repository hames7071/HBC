
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Multiple PDF Flipbooks</title>
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  
  <!-- Flipbook StyleSheet -->
  <link href="dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
  <!-- Icons Stylesheet -->
  <link href="dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">
  
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Style to display PDF containers */
    .pdf-container {
      display: inline-block;
      width: 200px;
      height: 300px;
      margin: 15px;
      border: 1px solid #ccc;
      cursor: pointer;
      text-align: center;
      position: relative;
    }

    .pdf-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .pdf-title {
      position: absolute;
      bottom: 10px;
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 5px;
    }
  </style>

</head>

<body>

  <div id="flipbookContainer" class="flex flex-wrap justify-center">
    <!-- PDF Containers (you can add as many as you want) -->
    <div class="pdf-container" onclick="openPDF('examples/Agronomy_note.pdf')">
      <img src="path_to_thumbnail_image.jpg" alt="Agronomy Note">
      <div class="pdf-title">Agronomy Note</div>
    </div>
    <div class="pdf-container" onclick="openPDF('examples/Another_PDF.pdf')">
      <img src="path_to_thumbnail_image.jpg" alt="Another PDF">
      <div class="pdf-title">Another PDF</div>
    </div>
    <!-- Add more PDF containers as needed -->
  </div>

  <!-- jQuery  -->
  <script src="dflip/js/libs/jquery.min.js" type="text/javascript"></script>
  <!-- Flipbook main Js file -->
  <script src="dflip/js/dflip.min.js" type="text/javascript"></script>

  <script>
    function openPDF(pdfPath) {
      window.open(pdfPath, '_blank');
    }
  </script>


  <!-- jQuery  -->
  <script src="dflip/js/libs/jquery.min.js" type="text/javascript"></script>
  <!-- Flipbook main Js file -->
  <script src="dflip/js/dflip.min.js" type="text/javascript"></script>
  <!-- Flipbook main Js file -->

      //uses source from online(make sure the file has CORS access enabled if used in cross domain)

        backgroundColor: "#2F2F2F"
      };
      var flipBook = $("#flipbookContainer").flipBook(pdf, options);
    });
  </script>
</body>

</html>
