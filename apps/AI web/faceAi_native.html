<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Photo Age Transformer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light blue-gray background */
        }
        .container-card {
            max-width: 95%;
            width: 100%;
            margin-top: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        .file-input-label {
            display: block;
            cursor: pointer;
            padding: 1rem;
            border: 2px dashed #3b82f6; /* Blue 500 */
            color: #3b82f6;
            text-align: center;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }
        .file-input-label:hover {
            background-color: #eff6ff; /* Blue 50 */
        }
        #fileInput {
            display: none;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen">

    <div class="container-card p-6 md:p-10 rounded-xl">
        <h1 class="text-3xl font-bold text-center text-gray-900 mb-2">
            <span class="text-blue-600">Gemini</span> Age Transformer
        </h1>
        <p class="text-center text-gray-500 mb-8">
            Upload a photo to see the subject as a child, young adult, and elder, sitting together on a bench.
        </p>

        <!-- Input Section -->
        <div class="space-y-6">
            <label for="fileInput" class="file-input-label">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 inline-block mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <span id="fileNameDisplay">Select an image file (PNG/JPEG)</span>
            </label>
            <input type="file" id="fileInput" accept="image/png, image/jpeg" onchange="displayFileName(this)">
            
            <button id="transformButton" onclick="transformImage()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-300 disabled:opacity-50 shadow-md">
                Start Transformation
            </button>
            
            <div id="errorBox" class="p-3 bg-red-100 text-red-700 rounded-lg hidden" role="alert"></div>
        </div>
        
        <!-- Output and Loading Section -->
        <div class="mt-10">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">Result</h2>
            
            <!-- Loading Indicator -->
            <div id="loadingIndicator" class="hidden text-center p-6">
                <div class="flex items-center justify-center space-x-2">
                    <div class="w-4 h-4 rounded-full animate-pulse bg-blue-500"></div>
                    <div class="w-4 h-4 rounded-full animate-pulse bg-blue-500 delay-150"></div>
                    <div class="w-4 h-4 rounded-full animate-pulse bg-blue-500 delay-300"></div>
                </div>
                <p class="mt-3 text-gray-600">Generating your life timeline...</p>
                <p class="text-sm text-gray-400">This can take up to 30 seconds.</p>
            </div>
            
            <!-- Image Output -->
            <div id="imageOutput" class="rounded-lg overflow-hidden border border-gray-200">
                <p class="text-center text-gray-500 p-8">Your generated image will appear here after transformation.</p>
            </div>
        </div>

    </div>

    <script type="module">
        // Global variables provided by the environment
        const apiKey = ""; // Leave as-is, automatically handled by the environment
        
        // Model and API settings
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`;
        const MAX_RETRIES = 5;

        // UI elements
        const fileInput = document.getElementById('fileInput');
        const transformButton = document.getElementById('transformButton');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const imageOutput = document.getElementById('imageOutput');
        const errorBox = document.getElementById('errorBox');

        /**
         * Exponential backoff utility for robust API calls.
         * @param {number} attempt - Current attempt number (0-indexed).
         * @returns {number} Delay in milliseconds.
         */
        const getBackoffDelay = (attempt) => {
            return Math.pow(2, attempt) * 1000 + Math.random() * 1000;
        };

        /**
         * Helper function to read the uploaded file and convert it to Base64.
         * @param {File} file - The file object from the input.
         * @returns {Promise<string>} Base64 data string (e.g., 'iVBORw0KGgo...').
         */
        const fileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]); // Only data part
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        };

        /**
         * Displays the name of the selected file.
         * @param {HTMLInputElement} input - The file input element.
         */
        window.displayFileName = (input) => {
            if (input.files.length > 0) {
                fileNameDisplay.textContent = input.files[0].name;
                errorBox.classList.add('hidden'); // Clear any previous error
            } else {
                fileNameDisplay.textContent = 'Select an image file (PNG/JPEG)';
            }
        };

        /**
         * Main function to handle the image transformation API call.
         */
        window.transformImage = async () => {
            const file = fileInput.files[0];
            if (!file) {
                errorBox.textContent = 'Please select an image file first.';
                errorBox.classList.remove('hidden');
                return;
            }

            // Reset UI states
            errorBox.classList.add('hidden');
            imageOutput.innerHTML = '<p class="text-center text-gray-500 p-8">Generation in progress...</p>';
            transformButton.disabled = true;
            loadingIndicator.classList.remove('hidden');

            try {
                const base64ImageData = await fileToBase64(file);
                const mimeType = file.type;

                // --- LLM Prompt and Payload Construction ---
                const userPrompt = "Transform the person in the uploaded photo into three separate versions: one as a small child (approx 5 years old), one as a young adult (mid-twenties), and one as an old person (70+). Place all three versions of the person sitting side-by-side on a simple white park bench, looking friendly and reflective. Maintain the original subject's facial features and overall resemblance across all ages. Ensure the final image has a high-quality, realistic photographic style. The three figures must be clearly visible and distinct.";
                
                const payload = {
                    contents: [{
                        parts: [
                            { text: userPrompt },
                            {
                                inlineData: {
                                    mimeType: mimeType,
                                    data: base64ImageData
                                }
                            }
                        ]
                    }],
                    generationConfig: {
                        responseModalities: ['TEXT', 'IMAGE']
                    },
                };

                let response, result;
                let success = false;

                // API Call with Exponential Backoff
                for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
                    try {
                        response = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (response.ok) {
                            result = await response.json();
                            success = true;
                            break; // Success! Exit loop.
                        } else if (response.status === 429 || response.status >= 500) {
                            // Too Many Requests or Server Error - retry
                            if (attempt < MAX_RETRIES - 1) {
                                const delay = getBackoffDelay(attempt);
                                await new Promise(resolve => setTimeout(resolve, delay));
                            } else {
                                throw new Error(`API call failed after ${MAX_RETRIES} attempts with status ${response.status}.`);
                            }
                        } else {
                            // Other non-retryable error
                            const errorBody = await response.text();
                            throw new Error(`API call failed with status ${response.status}: ${errorBody}`);
                        }
                    } catch (fetchError) {
                        if (attempt === MAX_RETRIES - 1) {
                            throw fetchError; // Re-throw the final error
                        }
                    }
                }

                if (!success || !result) {
                    throw new Error("Failed to receive a valid response from the generation model.");
                }

                // Extract and display the image
                const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                
                if (base64Data) {
                    const imageUrl = `data:image/png;base64,${base64Data}`;
                    imageOutput.innerHTML = `<img src="${imageUrl}" alt="Age Transformation Result" class="w-full h-auto rounded-lg object-contain">`;
                } else {
                    imageOutput.innerHTML = '<p class="text-center text-red-500 p-8">Transformation failed. The model could not generate the image. Please try a different photo or prompt.</p>';
                    errorBox.textContent = 'Image generation failed: No image data returned.';
                    errorBox.classList.remove('hidden');
                }

            } catch (error) {
                console.error("Transformation Error:", error);
                errorBox.textContent = `An error occurred: ${error.message}. Please check the console for details.`;
                errorBox.classList.remove('hidden');
                imageOutput.innerHTML = '<p class="text-center text-red-500 p-8">Error during transformation. Please try again.</p>';
            } finally {
                transformButton.disabled = false;
                loadingIndicator.classList.add('hidden');
            }
        };

        // Initialize logging for debugging
        console.log("Gemini Age Transformation App initialized.");

    </script>
</body>
</html>
