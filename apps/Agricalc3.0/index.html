<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRICalc Pro | Universal Agri-Calculator</title>
    
    <!-- Load styles and icons with HTTPS to ensure GitHub Pages compatibility -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Courier+Prime&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; }
        .receipt-font { font-family: 'Courier Prime', monospace; }

        @media print {
            body { background-color: white; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            main { padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
            .print-area { 
                width: 100%; 
                max-width: 450px; 
                margin: 0 auto; 
                border: 1px solid #000;
                padding: 20px;
            }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="text-slate-900">

    <header class="bg-emerald-800 text-white p-6 no-print">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white p-2 rounded-lg text-emerald-800">
                    <i class="ph ph-leaf text-3xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold">AGRICalc Pro</h1>
                    <p class="text-emerald-200 text-sm">Universal Agri-Input Planner</p>
                </div>
            </div>
            <button onclick="window.print()" class="bg-emerald-700 hover:bg-emerald-600 px-6 py-2 rounded-full text-sm font-bold flex items-center gap-2 transition border border-emerald-500 shadow-lg">
                <i class="ph ph-printer"></i> Print Slip
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-8 space-y-8">
        
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 no-print">
            <div class="lg:col-span-2 card p-6">
                <h2 class="text-lg font-semibold mb-4 text-emerald-800">Crop & Area Settings</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Select Crop</label>
                            <select id="cropSelect" class="w-full p-3 rounded-lg border border-slate-200 bg-slate-50 outline-none" onchange="updateCropProfile()">
                                <optgroup label="Cereals">
                                    <option value="rice">Rice (Paddy)</option>
                                    <option value="wheat">Wheat</option>
                                    <option value="maize">Maize</option>
                                </optgroup>
                                <optgroup label="Spices">
                                    <option value="coriander">Coriander</option>
                                    <option value="fennel">Fennel</option>
                                    <option value="ginger">Ginger</option>
                                </optgroup>
                                <optgroup label="Vegetables">
                                    <option value="onion">Onion</option>
                                    <option value="potato">Potato</option>
                                    <option value="tomato">Tomato</option>
                                </optgroup>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Land Area Size</label>
                            <div class="flex">
                                <input type="number" id="areaInput" value="1" class="w-full p-3 rounded-l-lg border border-slate-200 outline-none">
                                <select id="areaUnit" class="p-3 bg-slate-100 border border-l-0 border-slate-200 rounded-r-lg text-sm">
                                    <option value="ha">Hectare</option>
                                    <option value="acre">Acre</option>
                                    <option value="bigha">Bigha</option>
                                    <option value="ropani">Ropani</option>
                                </select>
                            </div>
                        </div>
                        <button onclick="calculateAll()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition shadow-md">
                            <i class="ph ph-calculator"></i> Calculate Results
                        </button>
                    </div>
                    <div class="bg-emerald-50 rounded-xl p-4 flex flex-col justify-center border border-emerald-100">
                        <span class="text-xs font-bold text-emerald-800 uppercase">Converted Area</span>
                        <div class="text-2xl font-black text-emerald-600"><span id="activeAreaDisplay">1.00</span> <span class="text-sm">Ha</span></div>
                        <div id="areaBreakdown" class="text-[10px] text-emerald-700 mt-2"></div>
                    </div>
                </div>
            </div>

            <div class="card p-6 bg-slate-900 text-white">
                <p class="text-slate-400 text-xs uppercase font-bold tracking-widest">Adjusted Seed</p>
                <p class="text-4xl font-bold mb-4" id="statSeed">---</p>
                <p class="text-slate-400 text-xs uppercase font-bold tracking-widest">Fertilizer (Total)</p>
                <p class="text-4xl font-bold" id="statFert">---</p>
            </div>
        </section>

        <!-- Technical Inputs -->
        <section class="no-print card p-6 grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-amber-50 p-3 rounded-lg col-span-1 md:col-span-2">
                <label class="text-xs font-bold text-amber-800">Seed Quality (Germ % | Purity %)</label>
                <div class="flex gap-2">
                    <input type="number" id="germination" value="95" class="w-1/2 p-2 border rounded">
                    <input type="number" id="purity" value="98" class="w-1/2 p-2 border rounded">
                </div>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500">Seed Rate (kg/ha)</label>
                <input type="number" id="seedRate" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500">FYM (t/ha)</label>
                <input type="number" id="fymRate" class="w-full p-2 border rounded">
            </div>
            <div class="md:col-span-4 border-t pt-4 grid grid-cols-3 gap-4">
                <input type="number" id="reqN" placeholder="N" class="p-2 border rounded">
                <input type="number" id="reqP" placeholder="P" class="p-2 border rounded">
                <input type="number" id="reqK" placeholder="K" class="p-2 border rounded">
                <input type="hidden" id="rowS"><input type="hidden" id="plantS">
            </div>
        </section>

        <!-- Print Slip -->
        <section class="print-only print-area">
            <div class="bg-white border-2 border-dashed border-slate-900 p-8 receipt-font">
                <div class="text-center border-b-2 border-slate-900 pb-2 mb-4">
                    <h2 class="text-xl font-bold uppercase">AGRICalc Pro Slip</h2>
                    <p>Designed and Developed by Hem Chand</p>
                    <p id="slipDate" class="text-[10px]"></p>
                </div>
                <div class="text-sm space-y-2">
                    <div class="flex justify-between"><span>CROP:</span><span id="slipCrop" class="font-bold"></span></div>
                    <div class="flex justify-between"><span>AREA:</span><span id="slipArea" class="font-bold"></span></div>
                    <div class="flex justify-between"><span>SEEDS:</span><span id="slipSeed" class="font-bold"></span></div>
                    <div class="flex justify-between border-t border-slate-200 pt-2 font-bold"><span>FERTILIZERS:</span></div>
                    <div id="slipFertRows" class="space-y-1"></div>
                </div>
                <div class="text-center mt-10 text-[10px] italic border-t pt-2">Generated by AGRICalc Pro</div>
            </div>
        </section>
    </main>

    <script>
        const crops = {
            rice: { name: "Rice", seed: 40, n: 100, p: 60, k: 40, fym: 10 },
            wheat: { name: "Wheat", seed: 100, n: 120, p: 60, k: 40, fym: 10 },
            maize: { name: "Maize", seed: 20, n: 120, p: 60, k: 40, fym: 15 },
            onion: { name: "Onion", seed: 8, n: 100, p: 50, k: 50, fym: 20 },
            ginger: { name: "Ginger", seed: 1500, n: 75, p: 50, k: 50, fym: 25 },
            tomato: { name: "Tomato", seed: 0.5, n: 100, p: 80, k: 60, fym: 20 }
        };

        function updateCropProfile() {
            const crop = crops[document.getElementById('cropSelect').value];
            if(!crop) return;
            document.getElementById('seedRate').value = crop.seed;
            document.getElementById('reqN').value = crop.n;
            document.getElementById('reqP').value = crop.p;
            document.getElementById('reqK').value = crop.k;
            document.getElementById('fymRate').value = crop.fym;
        }

        function calculateAll() {
            const val = parseFloat(document.getElementById('areaInput').value) || 0;
            const unit = document.getElementById('areaUnit').value;
            const factors = { ha: 1, acre: 0.4047, bigha: 0.6772, ropani: 0.0508 };
            const ha = val * factors[unit];
            
            document.getElementById('activeAreaDisplay').innerText = ha.toFixed(4);
            document.getElementById('areaBreakdown').innerText = `${val} ${unit} converted to Ha`;

            const germ = parseFloat(document.getElementById('germination').value) || 100;
            const purity = parseFloat(document.getElementById('purity').value) || 100;
            const baseRate = parseFloat(document.getElementById('seedRate').value) || 0;
            
            const adjRate = (baseRate * 100 * 100) / (germ * purity);
            const totalSeed = adjRate * ha;
            const seedTxt = totalSeed.toFixed(2) + " kg";
            
            document.getElementById('statSeed').innerText = seedTxt;
            document.getElementById('slipSeed').innerText = seedTxt;

            const n = (parseFloat(document.getElementById('reqN').value) || 0) * ha;
            const p = (parseFloat(document.getElementById('reqP').value) || 0) * ha;
            const k = (parseFloat(document.getElementById('reqK').value) || 0) * ha;

            const dap = p / 0.46;
            const urea = Math.max(0, (n - (dap * 0.18)) / 0.46);
            const mop = k / 0.60;

            document.getElementById('statFert').innerText = (dap + urea + mop).toFixed(1) + " kg";

            document.getElementById('slipFertRows').innerHTML = `
                <div class="flex justify-between"><span>DAP:</span><span>${dap.toFixed(1)} kg</span></div>
                <div class="flex justify-between"><span>UREA:</span><span>${urea.toFixed(1)} kg</span></div>
                <div class="flex justify-between"><span>MOP:</span><span>${mop.toFixed(1)} kg</span></div>
            `;

            document.getElementById('slipCrop').innerText = document.getElementById('cropSelect').value.toUpperCase();
            document.getElementById('slipArea').innerText = `${val} ${unit}`;
            document.getElementById('slipDate').innerText = new Date().toLocaleString();
        }

        window.onload = updateCropProfile;
    </script>
</body>
</html>
