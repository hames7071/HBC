<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Admit Card</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        text-align: center;
        padding: 20px;
    }
    .container {
        max-width: 900px;
        margin: auto;
        background: #fff;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 10px;
    }
    h2 {
        color: #0044cc;
        margin-bottom: 5px;
    }
    input[type="text"] {
        padding: 8px;
        width: 200px;
        margin-right: 10px;
    }
    button {
        padding: 8px 15px;
        background: #0044cc;
        color: #fff;
        border: none;
        cursor: pointer;
        border-radius: 4px;
    }
    button:hover {
        background: #003399;
    }
    .admit-card {
        width: 800px;
        margin: 20px auto;
        border: 2px solid #000;
        padding: 15px;
        text-align: left;
        position: relative;
    }
    .header {
        text-align: center;
        margin-bottom: 10px;
    }
    .header img {
        width: 80px;
        position: absolute;
        top: 10px;
        left: 15px;
    }
    .header h2 {
        margin: 0;
        font-size: 22px;
    }
    .header h3 {
        margin: 2px 0;
        font-size: 16px;
        color: #333;
    }
    .reg-no {
        position: absolute;
        top: 15px;
        right: 20px;
        font-weight: bold;
    }
    .student-info {
        display: flex;
        border: 1px solid #000;
        padding: 10px;
    }
    .photo {
        width: 150px;
        text-align: center;
        border-right: 1px solid #000;
        padding-right: 10px;
    }
    .photo img {
        max-width: 120px;
        height: auto;
    }
    .details {
        flex: 1;
        padding-left: 15px;
    }
    .details p {
        margin: 4px 0;
    }
    table.subjects {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }
    table.subjects th, table.subjects td {
        border: 1px solid #000;
        padding: 6px;
        text-align: left;
    }
    .signature {
        text-align: right;
        margin-top: 15px;
        font-style: italic;
    }
    .print-btn {
        margin-top: 15px;
        background: #28a745;
    }
    .print-btn:hover {
        background: #1e7e34;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Search Your Admit Card</h2>
    <p>Enter Registration Number:</p>
    <input type="text" id="regNo" placeholder="Enter Reg. No.">
    <button onclick="searchStudent()">Search</button>

    <div id="admitCard" class="admit-card" style="display:none;"></div>
    <button id="printBtn" class="print-btn" style="display:none;" onclick="printAdmitCard()">Print Admit Card</button>
</div>

<script>
async function loadExcelData() {
    const response = await fetch('assets/doc75/doc1/stubook.xlsx');
    const arrayBuffer = await response.arrayBuffer();
    const data = new Uint8Array(arrayBuffer);
    const workbook = XLSX.read(data, { type: 'array' });

    const studentSheet = XLSX.utils.sheet_to_json(workbook.Sheets['Students']);
    const facultySheet = XLSX.utils.sheet_to_json(workbook.Sheets['Faculty']);
    return { studentSheet, facultySheet };
}

async function searchStudent() {
    const regNo = document.getElementById('regNo').value.trim();
    if (!regNo) {
        alert('Please enter a Registration Number');
        return;
    }

    const { studentSheet, facultySheet } = await loadExcelData();
    const student = studentSheet.find(s => String(s['Reg. No.']) === regNo);

    if (!student) {
        alert('No record found!');
        return;
    }

    const subjectCodes = student['Subjects'].split(',').map(code => code.trim());
    const subjects = [];

    facultySheet.forEach(row => {
        for (let i = 1; i <= 5; i++) {
            const code = row[`Subject ${i} Course Code`];
            const course = row[`Subject ${i} Course`];
            if (subjectCodes.includes(String(code))) {
                subjects.push({ code, course });
            }
        }
    });

    const admitCardDiv = document.getElementById('admitCard');
    admitCardDiv.style.display = 'block';
    document.getElementById('printBtn').style.display = 'inline-block';

    admitCardDiv.innerHTML = `
        <div class="header">
            <img src="assets/images/logo.png" alt="Logo">
            <h2>High School Exam Board</h2>
            <h3>Heduda, Nepal</h3>
            <div class="reg-no">Reg. No.: ${student['Reg. No.']}</div>
            <h3>Exam Admit Card</h3>
        </div>
        <div class="student-info">
            <div class="photo">
                <img src="assets/images/${student['ID photo']}" alt="Photo">
            </div>
            <div class="details">
                <p><strong>Name:</strong> ${student['Name']}</p>
                <p><strong>Roll No:</strong> ${student['Roll No']}</p>
                <p><strong>Class:</strong> ${student['Class']}</p>
                <p><strong>Year:</strong> ${student['Year']}</p>
                <p><strong>School:</strong> ${student['School']}</p>
            </div>
        </div>
        <h4>Subject</h4>
        <table class="subjects">
            <tr><th>Course Code</th><th>Course</th></tr>
            ${subjects.map(s => `<tr><td>${s.code}</td><td>${s.course}</td></tr>`).join('')}
        </table>
        <div class="signature">
            <p>__________________________</p>
            <p>Exam Controller</p>
        </div>
    `;
}

function printAdmitCard() {
    const printContents = document.getElementById('admitCard').innerHTML;
    const originalContents = document.body.innerHTML;
    document.body.innerHTML = printContents;
    window.print();
    document.body.innerHTML = originalContents;
    location.reload();
}
</script>

</body>
</html>
