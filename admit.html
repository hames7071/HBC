<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Admit Card</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        text-align: center;
        padding: 20px;
    }
    .container {
        max-width: 900px;
        margin: auto;
        background: #fff;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 10px;
    }
    h2 {
        color: #0044cc;
        margin-bottom: 5px;
    }
    input[type="text"] {
        padding: 8px;
        width: 200px;
        margin-right: 10px;
    }
    button {
        padding: 8px 15px;
        background: #0044cc;
        color: #fff;
        border: none;
        cursor: pointer;
        border-radius: 4px;
    }
    button:hover {
        background: #003399;
    }
    .admit-preview {
        margin-top: 20px;
        padding: 15px;
        text-align: left;
        border: 1px dashed #666;
        background: #fafafa;
    }
    .open-print-btn {
        margin-top: 15px;
        background: #28a745;
    }
    .open-print-btn:hover {
        background: #1e7e34;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Search Your Admit Card</h2>
    <p>Enter Registration Number:</p>
    <input type="text" id="regNo" placeholder="Enter Reg. No.">
    <button onclick="searchStudent()">Search</button>

    <div id="preview" class="admit-preview" style="display:none;"></div>
    <button id="printBtn" class="open-print-btn" style="display:none;" onclick="openPrintPage()">Open & Print</button>
</div>

<script>
let generatedHTML = ''; // To store dynamic admit card content

async function loadExcelData() {
    const response = await fetch('assets/doc75/book1/stubook.xlsx');
    const arrayBuffer = await response.arrayBuffer();
    const data = new Uint8Array(arrayBuffer);
    const workbook = XLSX.read(data, { type: 'array' });

    const studentSheet = XLSX.utils.sheet_to_json(workbook.Sheets['Students']);
    const facultySheet = XLSX.utils.sheet_to_json(workbook.Sheets['Course']);
    return { studentSheet, facultySheet };
}

async function searchStudent() {
    const regNo = document.getElementById('regNo').value.trim();
    if (!regNo) {
        alert('Please enter a Registration Number');
        return;
    }

    const { studentSheet, facultySheet } = await loadExcelData();
    const student = studentSheet.find(s => String(s['Reg. No.']) === regNo);

    if (!student) {
        alert('No record found!');
        return;
    }

    const subjectCodes = student['Subjects'].split(',').map(code => code.trim());
    const subjects = [];

    facultySheet.forEach(row => {
        for (let i = 1; i <= 5; i++) {
            const code = row[`Subject ${i} Course Code`];
            const course = row[`Subject ${i} Course`];
            if (subjectCodes.includes(String(code))) {
                subjects.push({ code, course });
            }
        }
    });

    generatedHTML = `
        <div style="width:800px; margin:auto; border:2px solid #000; padding:15px; font-family:Arial;">
            <div style="text-align:center; position:relative;">
                <img src="assets/images/logo.png" alt="Logo" style="width:80px; position:absolute; top:10px; left:15px;">
                <h2 style="margin:0;">High School Exam Board</h2>
                <h3 style="margin:2px 0;">Heduda, Nepal</h3>
                <div style="position:absolute; top:15px; right:20px; font-weight:bold;">Reg. No.: ${student['Reg. No.']}</div>
                <h3>Exam Admit Card</h3>
            </div>
            <div style="display:flex; border:1px solid #000; padding:10px; margin-top:10px;">
                <div style="width:150px; text-align:center; border-right:1px solid #000; padding-right:10px;">
                    <img src="assets/images/${student['ID photo']}" alt="Photo" style="max-width:120px;">
                </div>
                <div style="flex:1; padding-left:15px;">
                    <p><strong>Name:</strong> ${student['Name']}</p>
                    <p><strong>Roll No:</strong> ${student['Roll No']}</p>
                    <p><strong>Class:</strong> ${student['Class']}</p>
                    <p><strong>Year:</strong> ${student['Year']}</p>
                    <p><strong>School:</strong> ${student['School']}</p>
                </div>
            </div>
            <h4 style="margin-top:10px;">Subject</h4>
            <table style="width:100%; border-collapse:collapse;">
                <tr><th style="border:1px solid #000; padding:6px;">Course Code</th><th style="border:1px solid #000; padding:6px;">Course</th></tr>
                ${subjects.map(s => `<tr><td style="border:1px solid #000; padding:6px;">${s.code}</td><td style="border:1px solid #000; padding:6px;">${s.course}</td></tr>`).join('')}
            </table>
            <div style="text-align:right; margin-top:15px;">
                <p>__________________________</p>
                <p>Exam Controller</p>
            </div>
        </div>
    `;

    // Show preview on main page
    document.getElementById('preview').innerHTML = generatedHTML;
    document.getElementById('preview').style.display = 'block';
    document.getElementById('printBtn').style.display = 'inline-block';
}

function openPrintPage() {
    const newWin = window.open('', '_blank');
    newWin.document.write(`
        <html>
        <head>
            <title>Admit Card</title>
        </head>
        <body onload="window.print(); window.close();">
            ${generatedHTML}
        </body>
        </html>
    `);
    newWin.document.close();
}
</script>

</body>
</html>
