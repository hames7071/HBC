<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fund Folio — Excel → Web</title>

  <!-- SheetJS for parsing xlsx -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root{
      --accent:#d70000;
      --muted:#666;
      --card-bg:#fff;
      --panel-bg:#fff8fc;
      --radius:10px;
      --shadow: 0 6px 20px rgba(0,0,0,0.08);
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color:#333;
    }
    body{margin:0;background:#f4f6f8;padding:18px;}
    .header{
      background:var(--accent);
      color:#fff;padding:18px;border-radius:8px;
      display:flex;align-items:center;gap:12px;
      box-shadow:var(--shadow);
    }
    .header .logo{
      width:36px;height:36px;background:#fff2;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;
    }
    .container{margin-top:18px;display:flex;gap:18px;align-items:flex-start;}
    .left-list{
      width:300px;background:#fff;border-radius:10px;padding:12px;box-shadow:var(--shadow);
    }
    .list-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
    .list-item:hover{background:#f8fafb;border-color:#eee;}
    .list-item img{width:56px;height:56px;border-radius:6px;object-fit:cover}
    .list-item .meta{font-size:14px}
    .list-item .meta .name{color:var(--accent);font-weight:700}
    .main{
      flex:1;background:#fff;border-radius:10px;padding:18px;box-shadow:var(--shadow);
      min-height:320px;
    }
    .profile-top{display:flex;gap:18px;align-items:center}
    .profile-photo{width:120px;height:120px;border-radius:8px;overflow:hidden;border:6px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,0.12)}
    .profile-photo img{width:100%;height:100%;object-fit:cover}
    .profile-meta h2{margin:0;color:var(--accent);font-size:22px}
    .profile-meta .address{color:var(--muted);margin-top:6px}
    .book-values{margin-left:auto;display:flex;flex-direction:column;gap:12px}
    .value-row{display:flex;gap:10px;align-items:center}
    .value-row .label{color:#2b7dbf}
    .pill{background:#f6f6f6;border-radius:24px;padding:8px 14px;border:1px solid #e6e6e6;min-width:90px;text-align:center}
    .desc-box{margin-top:18px;padding:18px;border-radius:8px;background:#fff2;border:1px solid #e8d8d8;color:var(--muted)}
    .actions{display:flex;gap:12px;margin-top:16px}
    .btn{padding:12px 20px;border-radius:8px;background:#222;color:#fff;border:none;cursor:pointer;box-shadow:0 6px 12px rgba(0,0,0,0.08)}
    .btn.secondary{background:#fff;border:1px solid #ddd;color:#222}
    .controls{display:flex;gap:12px;align-items:center}
    .small{font-size:13px;color:var(--muted)}
    .empty{color:var(--muted);padding:28px;border-radius:8px;border:1px dashed #eee;text-align:center}
    /* mobile */
    @media (max-width:880px){
      .container{flex-direction:column;}
      .left-list{width:100%}
      .profile-photo{width:90px;height:90px}
      .book-values{margin-left:0;flex-direction:row;gap:8px}
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">▢</div>
    <div style="font-weight:700">Fund Folio</div>
    <div style="margin-left:auto" class="small">Auto-updates from Excel</div>
  </div>

  <div class="container">
    <div class="left-list" id="leftList">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong>Members</strong>
        <div class="controls">
          <button id="refreshBtn" class="btn secondary">Refresh</button>
        </div>
      </div>

      <div id="membersContainer">
        <div class="empty">No records loaded yet.</div>
      </div>
    </div>

    <div class="main" id="mainPanel">
      <div class="empty">Select a member to view details</div>
    </div>
  </div>

  <script>
    /*
      Configuration - Edit these to point to your hosted assets
      EXCEL_URL should point to the .xlsx file, for example:
        https://your-domain.com/assets/document/book.xlsx
      IMAGE_BASE is a base path prefixed to whatever is in the Image column if it is just a filename.
      If the Excel 'Image' column already contains full URLs, set IMAGE_BASE = ''.
    */
    const EXCEL_URL = 'https://hemchand.com.np/assets/doc75/book1/book.xlsx'; // change this
    const IMAGE_BASE = 'https://hemchand.com.np/assets/doc75/book1/';         // change if needed

    // Poll interval in milliseconds for automatic updates
    const POLL_INTERVAL = 15000; // 15 seconds

    // Map column names to keys (exact strings expected in header row)
    const EXPECTED_COLUMNS = {
      'User ID': 'userId',
      'Image': 'image',
      'Name': 'name',
      'Address': 'address',
      'Book Value': 'bookValue',
      'Previous book': 'previousBook',
      'Current book': 'currentBook',
      'Description': 'description'
    };

    let currentData = [];
    let polling = null;

    document.getElementById('refreshBtn').addEventListener('click', () => loadExcel(true));

    async function loadExcel(force=false){
      try {
        const res = await fetch(EXCEL_URL, {cache: 'no-store'});
        if(!res.ok) throw new Error('Failed to fetch Excel file: ' + res.status);
        const ab = await res.arrayBuffer();
        const workbook = XLSX.read(ab, {type: 'array'});
        const firstSheetName = workbook.SheetNames[0];
        const ws = workbook.Sheets[firstSheetName];
        const json = XLSX.utils.sheet_to_json(ws, {defval: ''}); // array of rows as objects

        // If nothing changed and not force, skip re-render
        const jsonStr = JSON.stringify(json);
        if(!force && JSON.stringify(currentData) === jsonStr) {
          // no changes
          return;
        }
        currentData = jsonStr;
        const normalized = normalizeRows(json);
        renderList(normalized);
        if(normalized.length) renderProfile(normalized[0]); // default select first
      } catch (err){
        console.error(err);
        showError(err.message || String(err));
      }
    }

    // normalize rows: map header names to internal keys
    function normalizeRows(rows){
      return rows.map(row => {
        const out = {};
        for(const header in EXPECTED_COLUMNS){
          const key = EXPECTED_COLUMNS[header];
          out[key] = row[header] !== undefined ? row[header] : '';
        }
        // make sure numbers are strings for display
        out.bookValue = out.bookValue || '';
        out.previousBook = out.previousBook || '';
        out.currentBook = out.currentBook || '';
        // construct image url if necessary
        const imgVal = String(out.image || '').trim();
        if(!imgVal) out._imgUrl = '';
        else {
          if(imgVal.match(/^https?:\/\//i)) out._imgUrl = imgVal;
          else out._imgUrl = IMAGE_BASE + imgVal;
        }
        return out;
      });
    }

    // render left list
    function renderList(rows){
      const container = document.getElementById('membersContainer');
      if(!rows.length){
        container.innerHTML = '<div class="empty">No records found in Excel.</div>';
        document.getElementById('mainPanel').innerHTML = '<div class="empty">Select a member to view details</div>';
        return;
      }
      container.innerHTML = '';
      rows.forEach((r, idx) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <img src="${r._imgUrl || 'data:image/svg+xml;utf8,'+encodeURIComponent(generatePlaceholderSVG())}" alt="">
          <div class="meta">
            <div class="name">${escapeHtml(r.name || 'Unknown')}</div>
            <div class="small">${escapeHtml(r.address || '')} ${r.userId ? ' · ID: ' + escapeHtml(r.userId) : ''}</div>
          </div>
        `;
        div.addEventListener('click', () => renderProfile(r));
        container.appendChild(div);
      });
    }

    // render main profile panel
    function renderProfile(row){
      const panel = document.getElementById('mainPanel');
      panel.innerHTML = `
        <div class="profile-top">
          <div class="profile-photo"><img src="${row._imgUrl || 'data:image/svg+xml;utf8,'+encodeURIComponent(generatePlaceholderSVG())}" alt=""></div>
          <div class="profile-meta">
            <h2>${escapeHtml(row.name || 'No name')}</h2>
            <div class="address">${escapeHtml(row.address || '')}</div>
            <div class="small" style="margin-top:8px">ID: ${escapeHtml(row.userId || '')}</div>
          </div>

          <div class="book-values">
            <div class="value-row"><div class="label">Book Balance:</div><div class="pill">Rs. ${formatNumber(row.bookValue)}</div></div>
            <div class="value-row"><div class="label">Previous book:</div><div class="pill">Rs. ${formatNumber(row.previousBook)}</div></div>
            <div class="value-row"><div class="label">Current book:</div><div class="pill">Rs. ${formatNumber(row.currentBook)}</div></div>
          </div>
        </div>

        <div class="desc-box">
          ${escapeHtml(row.description || 'No additional description.')}
        </div>

        <div class="actions">
          <button class="btn">Book</button>
          <button class="btn">Payment</button>
          <button class="btn secondary">Ask</button>
          <button class="btn secondary">Profile</button>
        </div>
      `;
    }

    function showError(msg){
      const panel = document.getElementById('mainPanel');
      panel.innerHTML = `<div class="empty">Error loading data: ${escapeHtml(msg)}</div>`;
    }

    // helper: format numeric strings roughly
    function formatNumber(v){
      if(v === undefined || v === null || v === '') return '0';
      const num = Number(String(v).replace(/[^\d.-]/g,''));
      if(isNaN(num)) return escapeHtml(String(v));
      return num.toLocaleString();
    }

    // security: simple escape
    function escapeHtml(s){
      return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    // placeholder svg for missing images
    function generatePlaceholderSVG(){
      return `<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='100%' height='100%' fill='%23efefef'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23888888' font-family='Arial' font-size='20'>No Image</text></svg>`;
    }

    // start polling
    async function startPolling(){
      await loadExcel(true);
      if(polling) clearInterval(polling);
      polling = setInterval(()=> loadExcel(false), POLL_INTERVAL);
    }

    // initial run
    startPolling();

    // expose a fallback: if someone wants to load local file via file input
    (function addLocalFileSupport(){
      const f = document.createElement('input');
      f.type = 'file'; f.accept = '.xlsx';
      f.style.position='fixed'; f.style.right='18px'; f.style.bottom='18px'; f.title='Load local Excel';
      f.addEventListener('change', async (evt) => {
        const file = evt.target.files[0];
        if(!file) return;
        try {
          const ab = await file.arrayBuffer();
          const workbook = XLSX.read(ab, {type:'array'});
          const firstSheetName = workbook.SheetNames[0];
          const ws = workbook.Sheets[firstSheetName];
          const json = XLSX.utils.sheet_to_json(ws, {defval:''});
          currentData = JSON.stringify(json);
          const normalized = normalizeRows(json);
          renderList(normalized);
          if(normalized.length) renderProfile(normalized[0]);
        } catch(err){ showError(err.message || String(err)); }
      });
      document.body.appendChild(f);
    })();
  </script>
</body>
</html>
